version: '3'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_fastapi
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/test_fastapi

  migrator:
    build: .
    depends_on:
      - db
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/test_fastapi

volumes:
  pgdata: